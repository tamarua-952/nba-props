name: Step 0 source probe

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_sources.py
      - scripts/fetch_samples.py
      - .github/workflows/step0-probe.yml

permissions:
  contents: write

# Every workflow that commits to the repo shares this group, so runs queue
# instead of racing each other's pushes.
concurrency:
  group: repo-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe sources
        env:
          PROBE_LABEL: github-actions
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/probe_sources.py
      - name: Fetch ESPN parser fixtures
        run: python scripts/fetch_samples.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/step0
          [ -d tests/fixtures ] && git add tests/fixtures
          [ -f data/odds_api_usage.json ] && git add data/odds_api_usage.json
          git diff --cached --quiet && exit 0
          git commit -m "Step 0 probe report and ESPN fixtures (GitHub Actions)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
