# NBA Props Analyst configuration. See SPEC.md.

markets: [PTS, REB]

pricing:
  margin_buffer: 0.05        # bet threshold = fair price * (1 + buffer)
  typical_market_price: 1.87 # used to rank picks by edge
  max_picks: 8
  min_picks: 5

sources:
  espn:
    min_interval_s: 0.5      # polite spacing between ESPN requests
  bbref:
    min_interval_s: 3.5      # stays under Basketball-Reference's 20 req/min
  cache_dir: data/raw

odds_api:
  regions: us
  markets: [player_points, player_rebounds]
  monthly_quota: 500         # free tier
  reserve: 40                # stop once remaining credits would drop below this
  usage_file: data/odds_api_usage.json
  max_games_per_day: 3       # only the top 3 pick games get Odds API calls
  when_short: keep_closing   # budget short: skip the morning call, keep the closing call

backtest:
  # ESPN season year: 2026 = 2025-26. Earlier seasons are history only (they
  # count toward min_prior_games); calibration is reported on evaluate_season.
  seasons:
    - {season: 2025, start: 2024-10-22, end: 2025-04-13}
    - {season: 2026, start: 2025-10-21, end: 2026-04-12}
  evaluate_season: 2026
  min_prior_games: 5         # player needs this many prior games (any season) to be projected
  min_proj_minutes: 20       # props are only offered on rotation players

calibration:
  # Walk-forward recalibration of P(over): q' = 0.5 + s*(q-0.5) + c, capped.
  # s (shrink toward 50%) and c (over/under offset) are refitted each date from
  # earlier results only. See nbaprops/calibrate.py.
  PTS: {shrink: true, offset: false, cap: 0.70}   # offset tested: no gain (log loss 0.6773 vs 0.6771)
  REB: {shrink: false, offset: true, cap: null}   # offset fixes over-side overstatement
  min_obs: 2000
  gate_pp: 0.02              # points go in the brief only if calibrated 60-75% buckets are within this
